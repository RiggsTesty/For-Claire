<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Claire</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #fff8fb;
    color: #2d2d2d;
    text-align: center;
    padding: 70px 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-weight: 600;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c48a97;
    margin-bottom: 70px;
}

.section {
    max-width: 640px;
    margin: 0 auto 80px auto;
}

button {
    background: transparent;
    border: 1px solid #e2a9b4;
    padding: 12px 32px;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background: #e2a9b4;
    color: white;
}

.hidden {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 1.2s ease, max-height 1.2s ease;
    margin-top: 30px;
    font-size: 18px;
    line-height: 1.9;
}

.show {
    opacity: 1;
    max-height: 1000px;
}

footer {
    margin-top: 120px;
    font-size: 14px;
    color: #c48a97;
}
</style>

<script>
function reveal(id){
    const element = document.getElementById(id);
    element.classList.toggle("show");
}
</script>

</head>

<body>

<div class="subtitle">Valentine’s Day</div>

        I recognized you.
    </div>
</div>
